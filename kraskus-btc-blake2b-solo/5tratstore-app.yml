id: kraskus-btc-blake2b-solo
name: XBT by Kraskus
tagline: External-wallet solo mining
description: >-
  BEFORE UPDATING: move any funds held in the old native wallet to another wallet you control, confirm receipt, and securely back up the wallet and recovery information. This release removes native-wallet controls. Never purge legacy app data to upgrade.
  XBT solo mining on the existing Bitcoin Knots BLAKE2b fork (activation height961640), not ordinary Bitcoin SHA-256. External payout address with a required1% developer fee paid directly in the coinbase. Node-derived coinbase maturity is retained, including the long-maturity rule. Simple Home, Mining, Blocks, Blockchain and Settings pages; themes, live worker telemetry and safe pruning controls. No user-facing native wallet. Existing wallet files are preserved during migration. Mining starts paused; set an external payout address and wait for node readiness before choosing Start mining. Kraskus Pool forwarding is under development.
version: 0.3.3
category: Mining
