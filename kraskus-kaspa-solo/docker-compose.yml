# 5tratumOS package for Kraskus Kaspa Solo.
#
# Self-contained: bundles its own kaspad, exactly like every other first-party
# Kraskus solo package (kraskus-zec-solo bundles zebra, kraskus-xmr-solo bundles
# monerod). Command V2's shared kaspad fleet-manager network belongs to a
# separate deployment model and is not referenced anywhere in this file.
#
# Conventions:
#   - the UI service publishes NO host port itself — app_proxy (platform-managed)
#     is the only thing bound to the manifest's `port:` (33067), reaching the UI
#     container over the app's own internal network via APP_HOST/APP_PORT
#   - only ports with a real external requirement are published to the host:
#     the miner-facing Stratum port, and kaspad's P2P port (needed for normal
#     node operation)
#   - kaspad's own RPC ports (gRPC/borsh/JSON) are internal-only
#   - persistent data under ${APP_DATA_DIR}/<subpath>
#   - app-scoped bridge networks only, no shared/external network of any kind

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80

  kaspad:
    image: kaspanet/rusty-kaspad@sha256:db36449e2f41cf33ab7c26683ce390cb71bdea9c403eefd2e740a7d5605bcd8b
    restart: unless-stopped
    command:
      - kaspad
      - --yes
      - --nologfiles
      - --disable-upnp
      - --utxoindex
      - --rpclisten=0.0.0.0:16110
      - --rpclisten-borsh=0.0.0.0:17110
      - --rpclisten-json=0.0.0.0:18110
    volumes:
      - ${APP_DATA_DIR}/node:/app/data
    ports:
      - "16111:16111/tcp"
    networks:
      - public
      - internal

  stratum:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-stratum@sha256:3abec9a6ea547fe477fceb1c11d950a0575d28830305d7646cd966d49d09759c
    restart: unless-stopped
    command:
      - /app/stratum-bridge
      - --config
      - /config/config.yaml
      - --node-mode
      - external
    environment:
      KRASKUS_SOLO_PAYOUT_FILE: "/run/kraskus/solo-payout-address"
    volumes:
      - ${APP_DATA_DIR}/wallet/.kraskus:/run/kraskus:ro
    ports:
      - "5556:5556/tcp"
    networks:
      - public
      - internal
    depends_on:
      - kaspad

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-adapter@sha256:f85d9be1031d6169e584444e18a00c28271fe5ca955fa1b42a482cc26d651d7f
    restart: unless-stopped
    environment:
      KASPA_STRATUM_API: http://stratum:3030
      LISTEN_PORT: "18420"
      KASPA_MINER_PORT: "5556"
      KASPAD_GRPC_ADDR: "kaspad:16110"
      KASPA_WALLET_API: "http://wallet-api:18422"
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet
    networks:
      - internal
    depends_on:
      - stratum
      - kaspad

  wallet-api:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-wallet-api@sha256:8a2f8695608aa66eb58e27d4035e5dcb9301d8229c8c6e2b0ed9c27969acff15
    restart: unless-stopped
    environment:
      LISTEN_PORT: "18422"
      KASPA_NETWORK: "mainnet"
      KASPA_WALLET_NAME: "kraskus"
      KASPA_WALLET_SERVER: "ws://kaspad:17110"
      KRASKUS_DEV_FEE_AUTO_PAY: "true"
      HOME: "/wallet"
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet
    networks:
      - internal
    depends_on:
      - kaspad

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-kaspa-solo-ui@sha256:e283cdcf410f392f934ad6bf17166d81fd79e27fe49668d8c83d7f5f2874c897
    restart: unless-stopped
    networks:
      - public
      - internal
    depends_on:
      - adapter

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
