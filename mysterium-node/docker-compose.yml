services:
  app_proxy:
    environment:
      APP_HOST: portal
      APP_PORT: 80

  portal-migrator:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: unless-stopped
    command:
    - /bin/sh
    - -ec
    - |
      test -s /portal/app.js
      test -s /portal/index.html
      printf '%s' '' | base64 -d | gzip -d > /portal/app.js.new
      printf '%s' '' | base64 -d | gzip -d > /portal/live.js.new
      printf '%s' '' | base64 -d | gzip -d > /portal/styles.css.new
      printf '%s' '' | base64 -d | gzip -d > /portal/index.html.new
      printf '%s' '' | base64 -d | gzip -d > /status-agent/status.sh.new
      printf '%s' '' | base64 -d | gzip -d > /nginx/default.conf.new
      mv /portal/app.js.new /portal/app.js
      mv /portal/live.js.new /portal/live.js
      mv /portal/styles.css.new /portal/styles.css
      mv /portal/index.html.new /portal/index.html
      chmod 755 /status-agent/status.sh.new
      mv /status-agent/status.sh.new /status-agent/status.sh
      cat /nginx/default.conf.new > /nginx/default.conf
      rm -f /nginx/default.conf.new
      if grep -q '^const nodeUiUrl=' /portal/app.js; then
        sed -i 's|^const nodeUiUrl=.*|const nodeUiUrl=`http://$${window.location.hostname}:4449/`;|' /portal/app.js
      else
        sed -i '/^const toast=/a const nodeUiUrl=`http://$${window.location.hostname}:4449/`;' /portal/app.js
      fi
      sed -i "s|window.open('/node/'|window.open(nodeUiUrl|" /portal/app.js
      sed -i 's|https://mystnodes.co/?referral_code=|https://my.mystnodes.com/registration?referral_code=|g' /portal/app.js /portal/index.html
      sed -i 's|href="styles.css[^"]*"|href="styles.css?v=2.6.12"|' /portal/index.html
      sed -i 's|src="app.js[^\"]*"|src="app.js?v=2.6.12"|' /portal/index.html
      sed -i 's|src="live.js[^\"]*"|src="live.js?v=2.6.12"|' /portal/index.html
      grep -Fq ':4449/' /portal/app.js
      grep -Fq 'styles.css?v=2.6.12' /portal/index.html
      grep -Fq 'app.js?v=2.6.12' /portal/index.html
      grep -Fq 'live.js?v=2.6.12' /portal/index.html
      grep -Fq 'EARNINGS BY SERVICE' /portal/index.html
      grep -Fq 'Kraskus App 2.6.12' /portal/index.html
      grep -Fq 'renderServiceEarnings' /portal/live.js
      grep -Fq '2.6.12 presentation and embedded-window refinements' /portal/styles.css
      grep -Fq 'STATUS_APP_VERSION:-2.6.12' /status-agent/status.sh
      grep -Fq 'collect_myst_price' /status-agent/status.sh
      grep -Fq 'location /live-api/' /nginx/default.conf
      touch /tmp/portal-migrated
      exec tail -f /dev/null
    volumes:
    - ${APP_DATA_DIR}/data/portal:/portal
    - ${APP_DATA_DIR}/data/status-agent:/status-agent
    - ${APP_DATA_DIR}/data/nginx:/nginx
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/portal-migrated
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 1s

  portal:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/portal:/usr/share/nginx/html:ro
    - ${APP_DATA_DIR}/data/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ${APP_DATA_DIR}/data/status:/status:ro
    security_opt:
    - no-new-privileges:true
    ports:
    - 0.0.0.0:33060:80
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      update-agent:
        condition: service_started
      portal-migrator:
        condition: service_healthy

  mysterium:
    image: mysteriumnetwork/myst:1.39.5-alpine@sha256:d0c270c6bcb50c1004ba355c264f85aa16b3a5a414f8b9f8f5b0f449ea85a142
    restart: unless-stopped
    network_mode: host
    cap_add:
    - NET_ADMIN
    command:
    - service
    - --agreed-terms-and-conditions
    volumes:
    - ${APP_DATA_DIR}/data/mysterium:/var/lib/mysterium-node

  nodeui-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    network_mode: host
    volumes:
    - ${APP_DATA_DIR}/data/nodeui-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
    - no-new-privileges:true
    depends_on:
    - mysterium

  status-agent:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: unless-stopped
    network_mode: host
    environment:
      STATUS_APP_VERSION: 2.6.12
      NODE_VERSION: 1.39.5
      STATUS_INTERVAL: '30'
    command:
    - /bin/sh
    - /opt/status-agent/status.sh
    volumes:
    - ${APP_DATA_DIR}/data/status-agent:/opt/status-agent:ro
    - /proc:/host-proc:ro
    - /sys:/host-sys:ro
    - /:/host-root:ro
    - ${APP_DATA_DIR}/data/mysterium:/mysterium-data:ro
    - ${APP_DATA_DIR}/data/status:/status
    security_opt:
    - no-new-privileges:true
    depends_on:
      mysterium:
        condition: service_started
      portal-migrator:
        condition: service_healthy

  update-agent:
    image: docker:29.6.2-cli-alpine3.24@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
    restart: unless-stopped
    environment:
      APP_DIR: /app
      APP_DATA_DIR: ${APP_DATA_DIR}
      UPDATE_DIR: /update
      UPDATE_CHECK_INTERVAL: '21600'
      MYST_SERVICE: mysterium
    command:
    - /bin/sh
    - /opt/updater/serve.sh
    volumes:
    - ${APP_DATA_DIR}/data/updater:/opt/updater:ro
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}:${APP_DATA_DIR}
    - ${APP_DATA_DIR}/data/update:/update
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    depends_on:
    - mysterium
