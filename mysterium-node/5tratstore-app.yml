id: mysterium-node
name: MystNodes by Kraskus
tagline: Official MystNodes node fully integrated inside 5tratumOS
description: >-
  Official Mysterium node with a Kraskus dashboard for provider readiness,
  earnings, traffic and sessions. Version 2.7.0 adds timestamped snapshots,
  stale-data diagnostics, real provider-series charts with accessible point
  details, matching-period earnings per GB, reliable identity Copy controls,
  independent light/dark mode and three themes. Missing data stays explicit.
  Mysterium identity, payment handling, settlements and withdrawals remain in
  the official node and MystNodes dashboard; this update does not replace them.
  The upstream node remains pinned to its existing 1.39.7 image. New-user signup
  uses a disclosed Kraskus referral; existing users can open the official Node UI.
  Participation shares your connection with third-party traffic. Review Mysterium
  terms and choose appropriate services in the official Node UI.

version: 2.7.0
category: Networking
developer: Kraskus
website: https://www.mysterium.network/
repo: https://github.com/mysteriumnetwork/node
support: https://help.mystnodes.com/
icon: assets/mystnodes.png
port: 33060
path: /
uiMode: proxy
services:
  app_proxy:
    environment:
      APP_HOST: portal
      APP_PORT: 80
