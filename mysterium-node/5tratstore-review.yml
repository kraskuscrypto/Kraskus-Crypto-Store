notes: >-
  UI/read-only collector update, verified on VM100. Mysterium node container ID,
  image, start time and mounts remain unchanged; the October 28 process was not
  restarted. Payment runtime, official wallet/settlement paths, node console,
  updater and identity storage remain intact. Sixty desktop/mobile page-appearance
  checks passed using synthetic data, alongside clipboard, stale-data and monitor
  tests. Seven embedded payloads match the packaged sources. Existing host-network,
  NET_ADMIN and updater Docker-socket access are retained, not expanded.
  Upstream provider history can be sparse, out of range or unavailable; the UI
  does not invent zeros, settled totals or fiat rates. No new clean-room uninstall,
  upstream protocol, earnings guarantee or artwork-rights clearance is claimed.
  The prior proposed review status is retained; see RELEASE-2.7.0.md for scope.
