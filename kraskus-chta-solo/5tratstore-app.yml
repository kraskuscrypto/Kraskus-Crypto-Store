id: kraskus-chta-solo
name: CheetahCoin by Kraskus
tagline: CheetahCoin full node and SHA256 solo mining
description: >-
  CHTA Kraskus turns 5tratumOS into a self-contained CheetahCoin full node and
  solo-mining appliance. The Template V2 interface shows node synchronization,
  one truthful mining-readiness state, each Stratum port's live status,
  workers, accepted and rejected shares, round progress, and blocks
  independently confirmed by the node. Normal miners connect on port 1926;
  NMMiner and other very-low-hash devices use port 1927 with a fixed 0.002
  difficulty. Both ports stay closed until the node is synchronized and a
  valid payout is configured. The built-in CheetahCoin wallet can receive,
  send and act as the mining payout once you have downloaded and verified an
  encrypted backup of the complete wallet file; the same backup restores the
  exact wallet on any CHTA Kraskus install. A required 1% developer fee is
  paid directly from successful block coinbases.
version: 0.3.0
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Apps
support: https://kraskuscrypto.com/
icon: assets/chta-official-emblem-v2.png
port: 33064
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 80
