notes: >-
  0.2.33-beta production release migrates CHTA Solo to Kraskus App Template V2.
  The CheetahCoin Core and qualified CKPool image digests remain unchanged.
  The backend is based on the prior Dev6 image with one qualified correction:
  fresh parseable CKPool pool.status telemetry is treated as authoritative
  Stratum-online evidence when CKPool omits explicit online/ready flags.
  Qualification covered a fresh isolated install, live node synchronization,
  real payout validation/apply, full teardown/restart persistence, legacy UI
  to Template V2 upgrade state preservation, synced-node RPC, block-template
  telemetry, real mining.subscribe/mining.authorize, nginx proxy startup,
  and native 5tratumOS Dev Store install/update with settings and secrets
  preserved across the update. The Dev Store gate passed before promotion.
