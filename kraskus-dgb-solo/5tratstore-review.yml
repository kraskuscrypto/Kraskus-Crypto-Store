notes: >-
  0.1.3 is a node-only maintenance release: DigiByte Core 9.26.7
  (d7265fb0) replaces 9.26.6 before Thaw Day (mainnet block 24,490,000).
  9.26.7 finishes pending DigiDollar index updates before shutdown, so a
  stop while the first Thaw Day block is processed no longer ends in a
  fatal error and exit status 1. No consensus, mining, block-template,
  wallet-format or P2P change; no reindex. Wallet, adapter, Stratum lanes,
  developer fee (0.50 / 0.25 / 0.25 percent), UI layout and ports are
  unchanged from 0.1.1. Version 0.1.2 was never released.
