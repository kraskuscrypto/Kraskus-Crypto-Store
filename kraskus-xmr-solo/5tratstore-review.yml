# 0.1.15 release qualification
#
# Clean-install safety fix: removes the developer-address fallback from the
# miner gateway. Before wallet setup, Stratum remains available but XMRig Proxy
# stays stopped and no block template can be built against a fallback payout.
# After wallet create/restore writes wallet-config.json, the proxy starts
# automatically with the user wallet payout address. Dev fee remains 1% of
# successfully mined rewards after 60-block maturity; hashrate is never diverted.
