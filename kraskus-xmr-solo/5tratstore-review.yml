notes: >-
  XMR 0.1.14 Dev Store candidate from canonical source commit
  da26f67f06e44b8287595cdef226d79aa673aaac and GitHub Actions build
  35625993691. This release replaces the old miner-facing daemon HTTP mode
  with RandomX Stratum on TCP 1921 while retaining true solo block submission
  to the local monerod. It adds real worker/share/hashrate/difficulty telemetry,
  configurable share difficulty, Kaspa Template V2 UI parity, configured-wallet
  parity, the finalized Monero hero/branding, and preserves automatic non-blocking
  1% developer-fee settlement after 60-block maturity. All runtime images are
  pinned to immutable 0.1.14 GHCR digests. Source/runtime qualification
  passed; clean client install/update/uninstall qualification remains a Dev Store
  follow-up before any Main Store promotion.

# 0.1.6-beta release qualification
#
# Promotes the qualified XMR runtime image set from
# Kraskus-Mining-Platform-V2 source commit:
# ca8d5a6c9ced9e1fe8504fa53a44eb50fd1b08c0
#
# Runtime services are pinned to immutable GHCR digests.
# Full-wallet create/restore stores the local wallet password in an
# appliance-local mode-0600 credential used by the automatic developer-fee
# settlement worker. Watch-only wallets remain monitoring-only.
#
# Kraskus XMR Solo charges a 1% developer fee only on successfully mined
# block rewards. Settlement occurs automatically after maturity. Miner
# hashrate is never diverted.
#
# The adapter also persists last-known-good node telemetry so the UI can
# remain useful during temporary monerod RPC timeouts.


# 0.1.7-beta release qualification
#
# Updates only the XMR UI image to source commit:
# f69435d4898cfabab4d6e3948f78eef524715fda
#
# The wallet setup method controls are now explicitly presented as tabs.
# Selecting Create New Wallet, Restore Existing Wallet, or Watch-Only switches
# to the corresponding setup panel, updates accessibility state, and focuses
# the first relevant field. The lower action button remains the operation that
# actually creates/restores/configures the wallet.
#
# Monerod, adapter, miner gateway, and wallet API remain pinned to the same
# 0.1.6-beta qualified digests. No wallet, fee-settlement, miner-gateway, or
# daemon behavior changes are introduced by this package revision.


