description: 'BEFORE UPDATING FROM A NATIVE-WALLET RELEASE: send all holdings to a wallet you control
  and keep a verified recovery backup. Native-wallet controls are removed. Never delete legacy wallet
  data. Bitcoin SV mainnet node and solo Stratum controller, with external payout address and a required1%
  developer fee paid directly in the coinbase. SV Node1.2.2 and the existing chain configuration are retained.
  Simple Home, Mining, Blocks, Blockchain and Settings pages; themes, live worker telemetry and safe pruning
  controls. No user-facing native wallet. Existing wallet files are preserved during migration. Mining
  starts paused; set an external payout address and wait for node readiness before choosing Start mining.
  Kraskus Pool forwarding is under development. '
