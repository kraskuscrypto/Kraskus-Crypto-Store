id: kraskus-bch-solo
name: Bitcoin Cash by Kraskus
tagline: Bitcoin Cash solo mining directly to your external wallet
description: >-
  Bitcoin Cash by Kraskus runs a pruned Bitcoin Cash Node 29.2.0 (wallet disabled,
  about 10 GB of block data) and a solo-mining dashboard. It uses an external
  CashAddr payout address only: the app has no wallet and never asks for a
  recovery phrase, password or private key. A fixed 1 percent developer fee is
  applied only to successfully mined blocks, as a separate coinbase output; the
  miner receives the remaining 99 percent. Mining capability is enabled on TCP
  port 1933. Each startup is paused; save a valid external BCH payout address,
  wait for node sync, then use the authenticated Start control. Do not forward
  this miner port to the public internet.
version: 0.5.12
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Mining-Platform/tree/d2e118347f219f46bc27552db2a79839cc3d29c7/releases/ui-consistency-20261103/ui/bch
support: https://kraskuscrypto.com/
icon: assets/bch-store-emblem-v2.png
port: 33073
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
